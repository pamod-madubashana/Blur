name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0 or v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.normalize.outputs.version }}
    steps:
      - name: Normalize version
        id: normalize
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must be in semver format (e.g., 1.0.0 or v1.0.0)"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Normalized version: $VERSION"

  bump-version:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update version files
        run: |
          VERSION="${{ needs.validate.outputs.version }}"

          echo "$VERSION" > VERSION

          python3 -c "
          import json
          with open('package.json', 'r') as f:
              data = json.load(f)
          data['version'] = '$VERSION'
          with open('package.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          "

          python3 -c "
          import json
          with open('src-tauri/tauri.conf.json', 'r') as f:
              data = json.load(f)
          data['version'] = '$VERSION'
          with open('src-tauri/tauri.conf.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          "

          python3 -c "
          import re
          with open('src-tauri/Cargo.toml', 'r') as f:
              content = f.read()
          content = re.sub(r'^version\s*=\s*\"[^\"]*\"', 'version = \"$VERSION\"', content, flags=re.MULTILINE)
          with open('src-tauri/Cargo.toml', 'w') as f:
              f.write(content)
          "

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add VERSION package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git diff --cached --quiet || git commit -m "chore(release): v${{ needs.validate.outputs.version }}"
          git push origin master

  build:
    needs: [validate, bump-version]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Create artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null

          # MSI installer
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter *.msi -Recurse | Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName "release/Blur-Launcher_x64_en-US.msi" -Force
            Write-Host "Copied MSI: $($msi.Name)"
          } else {
            Write-Host "WARNING: No MSI found"
          }

          # NSIS setup.exe
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter *.exe -Recurse | Select-Object -First 1
          if ($setup) {
            Copy-Item $setup.FullName "release/Blur-Launcher_x64-setup.exe" -Force
            Write-Host "Copied Setup: $($setup.Name)"
          } else {
            Write-Host "WARNING: No NSIS installer found"
          }

          # Portable exe
          $portable = Get-ChildItem "src-tauri/target/release" -Filter *.exe | Select-Object -First 1
          if ($portable) {
            Copy-Item $portable.FullName "release/Blur-Launcher.exe" -Force
            Write-Host "Copied Portable: $($portable.Name)"
          } else {
            Write-Host "WARNING: No portable exe found"
          }

          Write-Host "`nRelease artifacts:"
          Get-ChildItem release | ForEach-Object { Write-Host "  - $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB)" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*
          if-no-files-found: warn

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VERSION="${{ needs.validate.outputs.version }}"

          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ needs.validate.outputs.version }}"

          PREV_TAG=$(gh release list --limit 100 --json tagName,publishedAt \
            --jq '[.[] | select(.tagName != "v'"$VERSION"'")] | sort_by(.publishedAt) | last | .tagName' 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            LOG_RANGE="${PREV_TAG}..v${VERSION}"
          else
            LOG_RANGE="v${VERSION}"
          fi

          PR_LIST=$(gh pr list --state merged --search "merged>=${PREV_TAG:-2020-01-01}" --json number,title,author \
            --jq '.[] | "- #" + (.number | tostring) + " " + .title + " (by @" + .author.login + ")"' 2>/dev/null || echo "")

          if [ -z "$PR_LIST" ]; then
            PR_LIST="_No pull requests merged since last release._"
          fi

          {
            echo "body<<RELEASE_BODY"
            echo "## What's Changed"
            echo ""
            echo "$PR_LIST"
            echo ""
            echo "## Installation"
            echo "Download the appropriate file for Windows:"
            echo "- **Installer**: `.exe` installer"
            echo "- **Portable**: `.exe` standalone executable (auto-updates supported)"
            echo ""
            echo "## Auto-Update"
            echo "The portable executable includes a built-in updater."
            echo "When a new version is released, the app will notify you and update automatically."
            echo "RELEASE_BODY"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: Release v${{ needs.validate.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
