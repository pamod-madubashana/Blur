<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blur // LAN Launcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>

  <!-- TopAppBar -->
  <header class="topbar">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
      <div class="brand-text">
        <h1 class="brand-title">BLUR</h1>
        <span class="brand-sub">LAN MODE LAUNCHER</span>
      </div>
    </div>
    <div class="badge" id="status-badge" data-state="idle">
      <span class="badge-dot"></span>
      <span class="badge-label" id="status-label">STANDBY</span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-grid">
    <!-- Left Column: Action + Logs -->
    <section class="col-left">
      <button class="btn-action clip-corner-btn" id="btn-launch" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
          <path d="M18.36 6.64a9 9 0 11-12.73 0M12 2v10"/>
        </svg>
        <span id="btn-launch-label">INITIALIZE</span>
      </button>
      <!-- Session Log -->
      <div class="console-panel clip-corner">
        <div class="console-body" id="console"></div>
        <div class="console-cursor">&gt; <span class="blink">_</span></div>
        <div class="console-glow"></div>
      </div>
    </section>

    <!-- Right Column: Adapters (full height) -->
    <section class="col-right">
      <div class="panel clip-corner adapter-panel">
        <div class="adapter-list" id="adapter-list">
          <div class="adapter-empty">Scanning adapters...</div>
        </div>
      </div>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
