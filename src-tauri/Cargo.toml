[package]
name = "blur-lan-launcher"
version = "0.1.0"
description = "LAN-mode launcher for Blur"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "blur-lan-launcher"
path = "src/main.rs"
